plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' version '1.6.10-1.0.4' // KSP plugin
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.example.gestiondeoptica"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // KSP argument for Room
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
    // --- SIMULATION ONLY: Keystore configuration ---
    signingConfigs {
        release {
            // In a real scenario, use a secure way to provide these (e.g., keystore.properties, env vars)
            storeFile file("gestion_optica_keystore.jks") // Will be created in app module root
            storePassword "android"
            keyAlias "optica_alias"
            keyPassword "android"
        }
    }
    // --- END SIMULATION ONLY ---
    buildTypes {
        release {
            signingConfig signingConfigs.release // Apply the signing configuration
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version" // Make sure kotlin_version is defined in project build.gradle
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    // Room components
    def room_version = "2.4.2" // Use a recent stable version
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version" // For KSP
    // Optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"
    // Optional - Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
